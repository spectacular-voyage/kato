name: Release Manual

on:
  workflow_dispatch:
    inputs:
      npm_publish_mode:
        description: "What to do with the assembled npm packages"
        required: true
        default: skip
        type: choice
        options:
          - skip
          - dry-run
          - publish
      npm_tag:
        description: "npm dist-tag to use for npm publish or dry-run"
        required: true
        default: latest
        type: string
      github_release_mode:
        description: "What to do with the GitHub Release for this version"
        required: true
        default: skip
        type: choice
        options:
          - skip
          - draft
          - publish

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: ubuntu-latest
            expected_os: linux
            expected_arch: x86_64
          - label: windows-x64
            runs_on: windows-latest
            expected_os: windows
            expected_arch: x86_64
          - label: macos-x64
            runs_on: macos-15-intel
            expected_os: darwin
            expected_arch: x86_64
          - label: macos-arm64
            runs_on: macos-latest
            expected_os: darwin
            expected_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Verify Native Runner Architecture
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          deno eval '
            const expectedOs = Deno.env.get("EXPECTED_OS");
            const expectedArch = Deno.env.get("EXPECTED_ARCH");
            if (Deno.build.os !== expectedOs || Deno.build.arch !== expectedArch) {
              console.error(
                `Expected ${expectedOs}/${expectedArch}, got ${Deno.build.os}/${Deno.build.arch}`,
              );
              Deno.exit(1);
            }
            console.log(`Runner verified: ${Deno.build.os}/${Deno.build.arch}`);
          '

      - name: Build Binaries
        run: deno task build:binaries -- --output-dir .test-tmp/binaries/${{ matrix.label }}

      - name: Package Bundle
        run: deno task package:binaries -- --input-dir .test-tmp/binaries/${{ matrix.label }} --output-dir .test-tmp/bundles/${{ matrix.label }} --label ${{ matrix.label }}

      - name: Smoke Test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=$(find ".test-tmp/bundles/${{ matrix.label }}" -maxdepth 1 -type d -name 'kato-v*-${{ matrix.label }}' | head -n 1)
          if [ -z "${bundle_dir:-}" ] || [ ! -d "$bundle_dir" ]; then
            echo "Bundle directory not found"
            exit 1
          fi
          "$bundle_dir/kato" --version

          port=45177
          log_dir="${RUNNER_TEMP:-/tmp}"
          log_path="$log_dir/kato-web-${{ matrix.label }}.log"
          "$bundle_dir/kato-web" --host 127.0.0.1 --port "$port" >"$log_path" 2>&1 &
          web_pid=$!

          cleanup() {
            kill "$web_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/login" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$log_path"
          exit 1

      - name: Smoke Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = Get-ChildItem ".test-tmp/bundles/${{ matrix.label }}" -Directory | Where-Object { $_.Name -like "kato-v*-${{ matrix.label }}" } | Select-Object -First 1
          if (-not $bundleDir) {
            throw "Bundle directory not found"
          }
          $bundlePath = $bundleDir.FullName
          & "$bundlePath/kato.exe" --version

          $port = 45177
          $logDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $stdoutLog = Join-Path $logDir "kato-web-${{ matrix.label }}.stdout.log"
          $stderrLog = Join-Path $logDir "kato-web-${{ matrix.label }}.stderr.log"
          $proc = Start-Process `
            -FilePath "$bundlePath/kato-web.exe" `
            -ArgumentList @("--host", "127.0.0.1", "--port", "$port") `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru

          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $resp = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/login"
                if ($resp.StatusCode -eq 200) {
                  $ok = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $ok) {
              if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
              if (Test-Path $stderrLog) { Get-Content $stderrLog }
              throw "kato-web did not respond on /login"
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Upload Binary Artifact Bundle
        uses: actions/upload-artifact@v7
        with:
          name: kato-${{ matrix.label }}
          path: |
            .test-tmp/bundles/${{ matrix.label }}/**
          if-no-files-found: error
          compression-level: 0

  assemble-npm-packages:
    name: Assemble npm Packages
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download Binary Artifact Bundles
        uses: actions/download-artifact@v8
        with:
          path: .test-tmp/downloaded-bundles

      - name: Assemble npm Packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundle_inputs < <(find .test-tmp/downloaded-bundles -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#bundle_inputs[@]}" -eq 0 ]; then
            echo "No bundle artifacts were downloaded"
            exit 1
          fi

          args=()
          for input_dir in "${bundle_inputs[@]}"; do
            if [ ! -f "$input_dir/bundle-metadata.json" ]; then
              echo "Missing bundle-metadata.json in $input_dir"
              exit 1
            fi
            args+=(--input-dir "$input_dir")
          done

          deno task assemble:npm-packages -- "${args[@]}" --output-dir .test-tmp/npm-packages/release

      - name: Upload npm Package Assembly Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kato-npm-packages
          path: |
            .test-tmp/npm-packages/release/**
          if-no-files-found: error
          compression-level: 0

  smoke-npm-install:
    name: Smoke npm Install (${{ matrix.label }})
    needs: assemble-npm-packages
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: ubuntu-latest
            expected_os: linux
            expected_arch: x86_64
          - label: windows-x64
            runs_on: windows-latest
            expected_os: windows
            expected_arch: x86_64
          - label: macos-x64
            runs_on: macos-15-intel
            expected_os: darwin
            expected_arch: x86_64
          - label: macos-arm64
            runs_on: macos-latest
            expected_os: darwin
            expected_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Native Runner Architecture
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          deno eval '
            const expectedOs = Deno.env.get("EXPECTED_OS");
            const expectedArch = Deno.env.get("EXPECTED_ARCH");
            if (Deno.build.os !== expectedOs || Deno.build.arch !== expectedArch) {
              console.error(
                `Expected ${expectedOs}/${expectedArch}, got ${Deno.build.os}/${Deno.build.arch}`,
              );
              Deno.exit(1);
            }
            console.log(`Runner verified: ${Deno.build.os}/${Deno.build.arch}`);
          '

      - name: Download npm Package Assembly Artifact
        uses: actions/download-artifact@v8
        with:
          name: kato-npm-packages
          path: .test-tmp/downloaded-npm-packages

      - name: Smoke npm Install
        run: deno task smoke:npm-install -- --input-dir .test-tmp/downloaded-npm-packages --npm-bin npm

  publish-npm-packages:
    name: Publish npm Packages
    if: github.event_name == 'workflow_dispatch' && inputs.npm_publish_mode != 'skip'
    needs: smoke-npm-install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm Package Assembly Artifact
        uses: actions/download-artifact@v8
        with:
          name: kato-npm-packages
          path: .test-tmp/downloaded-npm-packages

      - name: Publish npm Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            --input-dir .test-tmp/downloaded-npm-packages
            --npm-bin npm
            --tag "${{ inputs.npm_tag }}"
          )
          if [ "${{ inputs.npm_publish_mode }}" = "dry-run" ]; then
            args+=(--dry-run)
          else
            args+=(--provenance)
          fi
          deno task publish:npm-packages -- "${args[@]}"

  manage-github-release:
    name: Manage GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.github_release_mode != 'skip'
    needs: smoke-npm-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Binary Artifact Bundles
        uses: actions/download-artifact@v8
        with:
          path: .test-tmp/downloaded-bundles
          pattern: kato-*-x64
          merge-multiple: false

      - name: Download macOS ARM64 Binary Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          path: .test-tmp/downloaded-bundles
          pattern: kato-macos-arm64
          merge-multiple: false

      - name: Prepare Release Metadata
        id: prepare-release
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t metadata_files < <(find .test-tmp/downloaded-bundles -mindepth 2 -maxdepth 2 -type f -name bundle-metadata.json | sort)
          if [ "${#metadata_files[@]}" -eq 0 ]; then
            echo "No bundle-metadata.json files were downloaded"
            exit 1
          fi

          version=$(python3 - "${metadata_files[@]}" <<'PY'
          import json
          import sys

          versions = []
          for path in sys.argv[1:]:
              with open(path, "r", encoding="utf-8") as handle:
                  versions.append(json.load(handle)["version"])

          unique = sorted(set(versions))
          if len(unique) != 1:
              raise SystemExit(
                  f"Expected one bundled release version, got: {', '.join(unique)}"
              )

          print(unique[0])
          PY
          )

          tag="v${version}"
          title="${tag}"
          notes_source="documentation/notes/release-notes.v${version}.md"
          if [ ! -f "$notes_source" ]; then
            echo "Release notes file not found: $notes_source"
            exit 1
          fi

          notes_body="$RUNNER_TEMP/release-notes-${tag}.md"
          awk '
            BEGIN { in_frontmatter = 0; frontmatter_done = 0 }
            NR == 1 && $0 == "---" { in_frontmatter = 1; next }
            in_frontmatter && $0 == "---" { in_frontmatter = 0; frontmatter_done = 1; next }
            !in_frontmatter && frontmatter_done { print }
          ' "$notes_source" > "$notes_body"

          if [ ! -s "$notes_body" ]; then
            echo "Release notes body is empty after stripping front matter: $notes_source"
            exit 1
          fi

          assets_file="$RUNNER_TEMP/release-assets-${tag}.txt"
          find .test-tmp/downloaded-bundles -mindepth 2 -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) | sort > "$assets_file"
          if [ ! -s "$assets_file" ]; then
            echo "No release archives or checksum assets were found"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "notes_body=$notes_body" >> "$GITHUB_OUTPUT"
          echo "assets_file=$assets_file" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.github_release_mode }}
          RELEASE_TAG: ${{ steps.prepare-release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prepare-release.outputs.title }}
          RELEASE_NOTES_BODY: ${{ steps.prepare-release.outputs.notes_body }}
          RELEASE_ASSETS_FILE: ${{ steps.prepare-release.outputs.assets_file }}
        run: |
          set -euo pipefail

          mapfile -t assets < "$RELEASE_ASSETS_FILE"
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were prepared"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

            edit_args=(
              "$RELEASE_TAG"
              --title "$RELEASE_TITLE"
              --notes-file "$RELEASE_NOTES_BODY"
              --target "$GITHUB_SHA"
            )
            if [ "$RELEASE_MODE" = "draft" ]; then
              edit_args+=(--draft)
            else
              edit_args+=(--draft=false --latest)
            fi
            gh release edit "${edit_args[@]}"
          else
            create_args=(
              "$RELEASE_TAG"
              --title "$RELEASE_TITLE"
              --notes-file "$RELEASE_NOTES_BODY"
              --target "$GITHUB_SHA"
            )
            if [ "$RELEASE_MODE" = "draft" ]; then
              create_args+=(--draft)
            else
              create_args+=(--latest)
            fi
            create_args+=("${assets[@]}")
            gh release create "${create_args[@]}"
          fi
