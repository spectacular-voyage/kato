name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Run dependency audit
        run: deno task audit

      - name: Run non-test quality gates
        run: deno task ci:quality

      - name: Run tests with coverage
        run: deno task test:coverage --frozen

      - name: Run Kato Web tests
        run: deno task test:web

      - name: Generate lcov report
        run: deno task coverage:lcov

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: true
          use_oidc: true

  # Same tests on the other release platforms. Coverage, audit, lint, and
  # format stay in the Ubuntu job above.
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Run tests
        run: deno task test --frozen

      - name: Run Kato Web tests
        run: deno task test:web
